name: Atualizar estatísticas

on:
  schedule:
    - cron: "0 6 * * *"   # todo dia, 03h no horário de Brasília
  workflow_dispatch:       # botão "Run workflow" na aba Actions
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/atualizar-estatisticas.yml"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar cards
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/generate_stats.py MarcosUkyo
      - name: Commitar mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats/stats.svg assets/stats/langs.svg
          git diff --staged --quiet || (git commit -m "chore: atualizar estatísticas" && git push)
